[project]
name = "marina-backend"
version = "0.1.0"
description = "MARINA INTELLIGENCE: Professional Football Performance Analytics Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "greenlet>=3.1.0",
    "pandas>=2.2.0",
    "beautifulsoup4>=4.12.0",
    "pandera>=0.20.0",
    "click>=8.1.0",
    "mplsoccer>=1.8.0",
    "matplotlib>=3.8.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
